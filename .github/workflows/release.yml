# Livraison : chaque push sur main produit un .aab signé et le dépose sur la
# piste Internal testing de Google Play. Aucune promotion vers une piste
# ouverte n'est automatisée — c'est une décision produit, elle se prend dans
# la Play Console.
name: Release

on:
  push:
    branches:
      - main

# Un seul run à la fois, et jamais d'annulation en vol : couper un run entre
# le build et l'upload consommerait un versionCode sans rien publier.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Bundle signé et dépôt sur la piste Internal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Même contrainte qu'en CI : sans ce fichier, le plugin Google Services
      # fait échouer le build. Cf. app/google-services.sample.json.
      - name: Restaurer google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 absent. Voir la section Release du README."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      # Le keystore est écrit dans RUNNER_TEMP, hors de l'arbre de travail :
      # il ne peut donc pas être ramassé par un artifact ni par un git add.
      # RUNNER_TEMP est purgé à la fin du job.
      - name: Décoder le keystore d'upload
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent. Voir la section Release du README."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/upload-keystore.jks"
          echo "path=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_OUTPUT"

      # Strictement croissant et jamais réutilisé : Play rejette un versionCode
      # déjà vu, et github.run_number ne recule pas. L'offset de 100 dépasse
      # les versionCode publiés avant la remise à zéro du compteur de runs
      # (nouveau dépôt). Calcul en shell : les expressions GitHub ne font pas
      # d'arithmétique.
      - name: Calculer le versionCode
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "versionCode = $((GITHUB_RUN_NUMBER + 100))"

      - name: Bundle release signé
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Adresses de contact de l'écran Compte (variables de dépôt, non
          # secrètes). Absentes : repli sur les adresses publiques du site.
          CONTACT_EDITORIAL_EMAIL: ${{ vars.CONTACT_EDITORIAL_EMAIL }}
          CONTACT_SUPPORT_EMAIL: ${{ vars.CONTACT_SUPPORT_EMAIL }}
        run: ./gradlew bundleRelease

      # Téléversé AVANT l'appel Play : si l'upload échoue (droits du compte de
      # service, fiche non publiée), le bundle reste récupérable pour un dépôt
      # manuel, sans relancer un build ni brûler un versionCode.
      - name: Artifact — bundle release
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Dépôt sur la piste Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.thermostat6.app180
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Le keystore disparaît avec le runner, mais un job qui échoue après le
      # décodage laisse le fichier le temps d'éventuelles étapes suivantes :
      # on l'efface explicitement, quel que soit le résultat.
      - name: Effacer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
